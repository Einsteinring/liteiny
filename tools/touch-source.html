<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face { font-family: 'Old Standard TT'; src: url('../assets/fonts/old-standard-400.woff2') format('woff2'); }
* { margin:0; box-sizing:border-box }
body { width:180px; height:180px; background:#1a1c21; display:flex;

.l { color:#f0f0ec; font-family:'Old Standard TT', Georgia, serif; font-size:78px; line-height:1; margin-top:-4px }
.r { position:absolute; bottom:14px; left:50%; width:64px; height:4px; margin-left:-32px; background:#b8473a }
</style></head><body><div class="seal"><div class="l">Л</div></div><div class="r"></div></body></html>
